<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; height: 100vh; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 720px; display: flex; flex-direction: column; height: 100vh; padding: 20px; }
  h1 { text-align: center; font-size: 22px; font-weight: 600; color: #333; padding: 16px 0; flex-shrink: 0; }
  #chat { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
  .user { background: #e3f2fd; color: #1565c0; align-self: flex-end; border-bottom-right-radius: 4px; }
  .assistant { background: #fff; color: #333; align-self: flex-start; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .msg .cursor { display: inline-block; width: 2px; height: 1em; background: #666; margin-left: 2px; animation: blink .8s step-end infinite; vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }
  #inputBar { display: flex; gap: 10px; padding: 16px 0; flex-shrink: 0; }
  #input { flex: 1; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 24px; font-size: 15px; outline: none; transition: border .2s; }
  #input:focus { border-color: #1976d2; }
  #send { padding: 12px 24px; background: #1976d2; color: #fff; border: none; border-radius: 24px; font-size: 15px; cursor: pointer; transition: background .2s; flex-shrink: 0; }
  #send:hover { background: #1565c0; }
  #send:disabled { background: #90caf9; cursor: not-allowed; }
  #loading { display: none; text-align: center; color: #999; font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>AI 助手</h1>
  <div id="chat"></div>
  <div id="loading">思考中…</div>
  <div id="inputBar">
    <input type="text" id="input" placeholder="输入你的问题…" autofocus>
    <button id="send">发送</button>
  </div>
</div>
<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const loading = document.getElementById('loading');

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (role === 'user') {
      div.textContent = text;
    } else {
      div.dataset.content = '';
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      div.appendChild(cursor);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function appendToAssistant(msgDiv, text) {
    const cursor = msgDiv.querySelector('.cursor');
    const prev = msgDiv.dataset.content || '';
    msgDiv.dataset.content = prev + text;
    if (cursor) {
      cursor.remove();
      msgDiv.textContent = msgDiv.dataset.content;
      msgDiv.appendChild(cursor);
    } else {
      msgDiv.textContent = msgDiv.dataset.content;
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function finishAssistant(msgDiv) {
    const cursor = msgDiv.querySelector('.cursor');
    if (cursor) cursor.remove();
    msgDiv.textContent = msgDiv.dataset.content || '';
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    addMessage(text, 'user');
    loading.style.display = 'block';
    sendBtn.disabled = true;

    const msgDiv = addMessage('', 'assistant');
    const es = new EventSource('/chat/stream?query=' + encodeURIComponent(text));
    es.onmessage = function(e) {
      if (loading.style.display === 'block') loading.style.display = 'none';
      appendToAssistant(msgDiv, e.data);
    };
    es.onerror = function() {
      es.close();
      finishAssistant(msgDiv);
      sendBtn.disabled = false;
    };
    es.onopen = function() {
      loading.style.display = 'none';
    };
  }
</script>
</body>
</html>
