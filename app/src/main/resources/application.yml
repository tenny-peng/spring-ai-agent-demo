server:
  port: 8080
  servlet:
    encoding:
      enabled: true
      charset: utf-8
      force: true

spring:
  ai:
    zhipuai:
      api-key: ${ZHIPUAI_API_KEY}  # 你的智谱AI API Key
      chat:
        options:
          model: glm-4-flash      # 使用的模型，推荐性价比高的 glm-4-flash
          temperature: 0.7        # 控制生成文本的随机性（范围 0-1）